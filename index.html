<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swim With Me</title><link rel="stylesheet" href="style.css?v=1.10.0"></head><body>
<header><div class="brand"><div id="logoBox" class="mark">≈</div><div><strong id="familyName">Swim With Me</strong><small id="subtitle">Your swim story, together</small></div></div><div class="headerRight"><span class="version" aria-label="App version">v1.10.0</span><select id="swimmerSelect" aria-label="Choose swimmer" hidden></select><button id="logout" class="quiet" hidden>Sign out</button></div></header>
<div id="auth" class="auth"><div class="authCard"><div class="mark big">≈</div><h1>Every lap has a story.</h1><p>Track times, goals, and meets for everyone in your family.</p><div class="login-modes"><button id="parentMode" type="button" aria-pressed="true">I’m a parent</button><button id="familyMode" type="button" aria-pressed="false">Family</button><button id="swimmerMode" type="button" aria-pressed="false">I’m a swimmer</button></div><section id="parentLogin"><form id="authForm" novalidate><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="6" autocomplete="current-password"></label><button class="primary" type="submit">Sign in</button></form><button id="signup" class="quiet">Create an account</button><button id="forgotPassword" class="quiet" type="button">Forgot password?</button><form id="forgotForm" hidden><label>Account email<input name="email" type="email" required autocomplete="email"></label><button class="primary" type="submit">Send reset link</button><button id="backToSignIn" class="quiet" type="button">Back to sign in</button></form><form id="recoveryForm" hidden><label>New password<input name="password" type="password" minlength="6" autocomplete="new-password" required></label><label>Confirm new password<input name="confirm" type="password" minlength="6" autocomplete="new-password" required></label><button class="primary" type="submit">Save new password</button></form></section><form id="kidPairForm" hidden><h2>Connect your swim space</h2><p>Ask your parent for a code. You only need it once on this device.</p><label>Pairing code<input name="code" maxlength="24" required autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCD-1234-EF56-7890"></label><label>Device name<input name="device_name" maxlength="60" value="My swim phone" required></label><button class="primary" type="submit">Connect my device</button></form><p id="authMessage" role="status" aria-live="polite"></p></div></div>
<main id="app" hidden><nav id="tabs"><button data-tab="kid" class="active">My Swim</button><button data-tab="home">Overview</button><button data-tab="results">Results</button><button data-tab="progress">Progress</button><button data-tab="goals">Goals</button><button data-tab="meets">Meets</button><button data-tab="family">Family access</button><button data-tab="portal">Family portal</button></nav><div id="notice" role="status"></div><section id="view"></section></main>
<footer id="foot" hidden>Swim With Me · A place for every swimmer</footer><script src="config.js?v=1.10.0"></script><script src="animations.js?v=1.10.0"></script><script src="qrcode.min.js?v=1.10.0"></script><script src="app.js?v=1.10.0"></script></body></html>
